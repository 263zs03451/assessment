<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
<!--
  画面の表示領域をデバイスに合わせるためには、
  meta viewport と呼ばれるタグを
  head タグ内に追加する必要があります。
-->
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <!-- OGPの設定  -->
  <meta name="twitter:card" content="summary">
  <meta property="og:url" content="https://263zs03451.github.io/assessment/assessment.html">
  <meta property="og:title" content="あなたのいいところ診断">
  <meta property="og:description" content="ZEN Study Web アプリケーション開発コースで制作した、
    「あなたのいいところ診断」サイトです。">
  <!-- <link rel="stylesheet"  href="assessment.css"> -->
  <!-- bootstrap 使用宣言-->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha256-fx038NkLY4U1TCrBDiu5FWPEa9eiZu01EiLryshJbCo=" crossorigin="anonymous">
  <title>あなたのいいところ診断</title>
</head>
<!-- <body>  　　bootstrap css 使用　-->

<body class="bg-primary-subtle">
  <!-- 
  navbar は Navbar スタイルを使うことを宣言する class です。
  bg-primary は、Navbar に青の背景色を指定しています。
  data-bs-theme="dark" は Navbar にダークモードを使う指定で、
  ダークモードを指定することで文字色が白に変更されます。
  真ん中にある container-fluid は、
  Bootstrap デザインにおいて外枠の範囲を決める class です。
  -fluid がついている場合、外枠が常に画面幅いっぱいに広がることを示します。
  一番内側の navbar-brand は、
  Navbar でテキストを追加する際に用いられる class です。
-->
  <header>
    <nav class="navbar bg-primary" data-bs-theme="dark">
      <div class="container-fluid">
        <a class="navbar-brand" href="#">あなたのいいところ診断</a>
      </div>
    </nav>
  </header>

  <!--
  <h1>あなたのいいところは？</h1>
  <p>診断したい名前をいれて下さい</p>
  <input type="text" id="user-name" size="40" maxlength="20">
  <button id="assessment">診断する</button>

  div タグ
div （ディブ）タグの div とは
 Division（ディビジョン）の略称で、分割されたものという意味です。
このタグは他のタグとは異なり、
囲んでも多くの場合は何も起こりません。また、
意味も「分割されている」「囲まれている」程度しか持ちません。
しかし JavaScript でプログラムとタグを関連付けたり 
CSS で装飾したりしたいときに便利なため、
この div タグは非常によく使われるタグです。
<div id="result-area">
</div>
  <div id="result-area"></div>
  <div id="tweet-area"></div> 
-->
  <!--
container は外枠の範囲を決める class です。
画面幅いっぱいに広がる container-fluid とは異なり、
固定幅ですが、画面サイズに応じて固定の長さが異なるため
画面からはみ出す心配はありません。
pt-5 は、padding を要素の上部（top）に
一定程度設定することを宣言する class です。
数字の 5 は padding の相対的な大きさを示しています。
-->
  <div class="container pt-5">
    <h1>あなたのいいところは?</h1>
    <p>診断したい名前を入れて下さい</p>
    <!--<input type="text" id="user-name" size="40" maxlength="20">
    <button id="assessment">診断する</button>  -->
    <!--
      row と col-sm-9 col-lg-6 を組み合わせて、
      画面幅が大きいときに 画面幅の半分程度のサイズになるように
      調整しています。この仕組みのことをグリッドシステムといいます。
      input-group は Input group スタイルを使うことを
      宣言する class です。
      mb-3 は margin を要素の下部（bottom）に
      一定程度設定することを宣言する class です。
      数字の 3 は margin の相対的な大きさを示しています。
      form-control は、
      <input> のようなテキスト入力フォームにスタイルを与える
      class です。
      btn と btn-primary はボタンのスタイルの指定する class で、
      btn-primary で青いボタンを指定しています。
      -->
    <div class="row">
      <div class="col-sm-9 col-lg-6">
        <div class="input-group mb-3">
          <input type="text" class="form-control " id="user-name" size="40" maxlength="20">
          <button class="btn btn-primary" id="assessment">診断する</button>
        </div>
      </div>
    </div>

    <!--
    <div id="result-area"></div>
    <div id="tweet-area"></div>
  -->
    <!--
      row と col-lg-9 を組み合わせて、
      画面幅が大きいときは、カードが画面幅の 75% 程度の
      サイズになるように調整しています。
      mt-3 は margin を要素の上部（top）に
      一定程度設定することを宣言する class です。
    -->
    <div class="row">
      <div class="col-lg-9">
        <div id="result-area"></div>
      </div>
    </div>
    <div id="tweet-area" class="mt-3"></div>
  </div>
  <!--<div id="tweet-area"><p>ツイートエリアの子供のp要素</p></div> -->
  <script src="assessment.js"></script>
</body>

</html>
